<article [class]="(pageType === AppRoute.MAIN ? 'cities__card ' : '') +
 (pageType === AppRoute.OFFER ? 'near-places__card ' : '') +
 (pageType === AppRoute.FAVORITES ? 'favorites__card ' : '') +
 'place-card'
">
  @if (offer.isPremium) {
    <div class="place-card__mark">
      <span>Premium</span>
    </div>
  }
  <div [class]="(pageType === AppRoute.MAIN ? 'cities__image-wrapper ' : '') +
 (pageType === AppRoute.OFFER ? 'near-places__image-wrapper ' : '') +
 (pageType === AppRoute.FAVORITES ? 'favorites__image-wrapper ' : '') +
 'place-card__image-wrapper'">
    <a [routerLink]="[AppRoute.OFFER, offer.id]">
      <img
        class="place-card__image"
        src="{{ offer.previewImage }}"
        [style.width.px]="pageType === AppRoute.FAVORITES ? '150' : '260'"
        [style.height.px]="pageType === AppRoute.FAVORITES ? '110' : '200'"
        alt="Place image"
      />
    </a>
  </div>
  <div class="place-card__info">
    <div class="place-card__price-wrapper">
      <div class="place-card__price">
        <b class="place-card__price-value">{{ offer.price }}</b>
        <span class="place-card__price-text">&#47;&nbsp;night</span>
      </div>
      <button
        appToggleFavorite
        [bookmarkConfig]="{ activeClass: FavoriteClass.PLACE_CARD }"
        (favoriteToggled)="handleFavoriteToggled()"
        class="place-card__bookmark-button button"
        [class.place-card__bookmark-button--active]="
          offer.isFavorite && authStatus === AuthorizationStatus.AUTH
        "
        [disabled]="isFavoriteOffersLoading$ | async"
        type="button"
      >
        <svg class="place-card__bookmark-icon" width="18" height="19">
          <use xlink:href="#icon-bookmark"></use>
        </svg>
        <span class="visually-hidden">To bookmarks</span>
      </button>
    </div>
    <div class="place-card__rating rating">
      <div class="place-card__stars rating__stars">
        <span [style.width.%]="Math.round(offer.rating * 20)"></span>
        <span class="visually-hidden">Rating</span>
      </div>
    </div>
    <h2 class="place-card__name">
      <a [routerLink]="[AppRoute.OFFER, offer.id]">{{ offer.title }}</a>
    </h2>
    <p class="place-card__type">{{ offer.type | capitilize }}</p>
  </div>
</article>
